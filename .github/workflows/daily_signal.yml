name: Daily TQQQ Signal

'on':
  schedule:
    - cron: "15 01 * * 2-6"
  workflow_dispatch:

jobs:
  signal-check:
    runs-on: ubuntu-latest

    steps:
      - name: Download application files
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install application requirements
        run: pip install -r requirements.txt

      - name: Check for a trading signal
        run: python daily_signal.py
        env:
          TICKER: TQQQ

          USE_SMA: true
          BUY_DAYS: 250
          SELL_DAYS: 250
          USE_SMA_BUFFER: false
          SMA_BUFFER_PCT: 1.0
          USE_CONFIRMATION: false
          CONFIRMATION_DAYS: 2

          USE_RSI: false
          RSI_PERIOD: 14
          RSI_BUY_THRESHOLD: 50

          USE_52_WEEK: true
          LOW_BUY_DISCOUNT_PCT: 10
          HIGH_SELL_PCT: 10

          SEND_DAILY_STATUS: true

          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
